    <script type="text/javascript">
      var app = $.sammy("#main", function () {
        this.debug = true;

        this.get("/", function () {
          var action = function (options) {
            var pattern = "/";
            for (var key in options) {
              pattern = pattern.replace(":" + key, options[key] || "");
            }
            return pattern;
          };
          this.partial(action());
        });

        this.get("/game", function () {
          var action = function (options) {
            var pattern = "/game";
            for (var key in options) {
              pattern = pattern.replace(":" + key, options[key] || "");
            }
            return pattern;
          };
          this.partial(action());
        });

        this.get("/login", function () {
          var action = function (options) {
            var pattern = "/login";
            for (var key in options) {
              pattern = pattern.replace(":" + key, options[key] || "");
            }
            return pattern;
          };
          this.partial(action());
        });

        this.get("/register", function () {
          var action = function (options) {
            var pattern = "/register";
            for (var key in options) {
              pattern = pattern.replace(":" + key, options[key] || "");
            }
            return pattern;
          };
          this.partial(action());
        });
      });

      $(document).ready(function () {
        if ($("html").is(".history") && false) {
          app.run(window.location.pathname);
        } else {
          $(document).trigger("changed");
        }
      });
    </script>
    <script src="javascripts/plugins.js?b=b_675"></script>
    <script src="javascripts/main.js?b=b_675"></script>
